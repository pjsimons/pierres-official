<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIERRE S. | Official</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #141414;
      --text: #f0f0f0;
      --text-muted: #888888;
      --accent: #E01B22;
      --border: #262626;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-stack);
      line-height: 1.6;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Header & Inline Logo */
    header {
      text-align: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo-box {
      background: #ffffff;
      padding: 24px 16px;
      border-radius: 4px;
      display: inline-block;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      margin-bottom: 16px;
    }

    .logo-box svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .tagline {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    /* Content Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 24px;
    }

    h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      color: var(--accent);
    }

    p {
      font-size: 15px;
      color: #cccccc;
      margin-bottom: 12px;
    }

    p:last-child {
      margin-bottom: 0;
    }

    /* Audio / SoundCloud Embed */
    .audio-wrapper {
      margin-top: 12px;
      border: 1px solid var(--border);
      background: #000;
    }

    /* Links & Buttons */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background-color: #1a1a1a;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* Footer */
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding-top: 20px;
      border-top: 1px solid var(--border);
      letter-spacing: 1px;
    }
  </style>
</head>
